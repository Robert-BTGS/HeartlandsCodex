site_name: Heartlands Codex
site_url: https://robert-btgs.github.io/HeartlandsCodex/

theme:
  name: torillic
  logo: images/HeartlandsLogo.PNG
  favicon: images/HeartlandsLogo.PNG
  background_image: images/HeartlandsCodexBackground.jpg
  features:
    - navigation.tabs
    - toc.integrate
    - content.action.edit
    - content.backlinks
    - content.search.suggest
    - content.search.highlight

